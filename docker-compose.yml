version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/db:/app/db
    environment:
      - DB_PATH=/app/db/nodes.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/count"]
      interval: 30s
      timeout: 10s
      retries: 3